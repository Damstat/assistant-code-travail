<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistant Code du Travail</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script>
    // Appliqué avant l'affichage pour éviter un flash de la mauvaise couleur
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="entete">
    <div class="entete-contenu">
      <a class="marque" href="/" aria-label="Accueil">
        <img src="logo.svg" alt="" width="36" height="36">
        <div>
          <h1>Assistant Code du Travail</h1>
          <p class="sous-titre">Sénégal · loi n° 2026-18 du 3 septembre 2026</p>
        </div>
      </a>
      <div class="actions">
        <button type="button" class="bouton-icone" id="nouvelle" title="Nouvelle conversation" aria-label="Nouvelle conversation">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button type="button" class="bouton-icone" id="theme" title="Changer de thème" aria-label="Changer de thème">
          <svg class="icone-lune" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icone-soleil" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="conteneur">
    <section id="fil" class="fil" aria-live="polite"></section>

    <template id="modele-accueil">
      <div class="accueil">
        <div class="accueil-logo"><img src="logo.svg" alt="" width="72" height="72"></div>
        <h2>Une question sur le <span class="degrade">Code du Travail</span> ?</h2>
        <p>Les réponses sont rédigées uniquement à partir des articles de la loi, avec la référence de chaque article utilisé.</p>
        <div class="exemples">
          <button type="button" class="exemple"><span class="exemple-icone"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></svg></span><span>Combien de semaines dure le congé de maternité ?</span></button>
          <button type="button" class="exemple"><span class="exemple-icone"><svg viewBox="0 0 24 24"><path d="M6 2h12M6 22h12M7 2c0 5 10 5 10 10S7 17 7 22M17 2c0 5-10 5-10 10s10 5 10 10"/></svg></span><span>Quelle est la durée maximale de la période d'essai ?</span></button>
          <button type="button" class="exemple"><span class="exemple-icone"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg></span><span>À partir de quel âge peut-on travailler ?</span></button>
          <button type="button" class="exemple"><span class="exemple-icone"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span>Quelle est la durée légale du travail par semaine ?</span></button>
        </div>
        <p class="infos" id="infos"></p>
      </div>
    </template>
  </main>

  <footer class="saisie">
    <form id="formulaire" class="saisie-contenu">
      <textarea id="question" rows="1" maxlength="1000"
                placeholder="Posez votre question…" aria-label="Votre question" required></textarea>
      <span class="compteur" id="compteur" hidden></span>
      <button type="submit" id="envoyer" aria-label="Envoyer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <p class="avertissement">Outil pédagogique : vérifiez toujours les articles cités avant de vous en servir.</p>
  </footer>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
